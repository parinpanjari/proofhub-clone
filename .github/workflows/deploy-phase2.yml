name: Deploy Phase 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and deploy Phase 2 files
        run: |
          echo "Extracting Phase 2 files..."
          echo '' | base64 -d | tar xzf -
          echo "Files extracted:"
          find packages -name "*.ts" -o -name "*.tsx" -o -name "*.prisma" | sort | wc -l

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: Phase 2 - Full project management, tasks, kanban, chat, time tracking

          - Add TaskList, Label, TaskLabel models to Prisma schema
          - Backend CRUD for projects, task-lists, tasks, subtasks, comments, attachments, labels, time-entries, chat
          - Socket.io real-time events for all mutations
          - File upload with Sharp thumbnail generation
          - Frontend ProjectPage with 9-tab switcher (List, Board, Gantt, Table, Calendar, Files, Time, Discussions, Notes)
          - ListView with tasks grouped by TaskList, inline create, bulk select
          - KanbanBoard with columns per TaskList
          - TaskDetailPanel slide-over with full task editing
          - Chat module with channels, messages, reactions
          - Time tracking with timer and reports
          - File manager with thumbnails"
          git push
